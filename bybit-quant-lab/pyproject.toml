[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bybit-quant-lab"
version = "0.1.0"
description = "Framework de investigación y backtesting para futuros perpetuos lineales de Bybit (solo lectura, sin ejecución real)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
    "pydantic>=2.7,<3",
    "pyarrow>=16",
    "matplotlib>=3.8,<4",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
    "types-PyYAML>=6.0",
]

[project.scripts]
bql = "bybit_quant_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bybit_quant_lab = ["reporting/templates/*.html", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PL"]
ignore = ["PLR0913", "PLR0917", "PLW0603", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "N802", "N806", "PLC0415"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
