    exit_z: 0.5
    volume_window: 50
    max_rel_volume: 1.5
    min_rel_volume: 1.5

# Combinaciones evaluadas por 'bql compare'. Pesos y redundancia se ajustan solo con
# entrenamiento; el umbral de weighted_vote se elige con validación.
combinations:
  - name: vote_all
    mode: simple_vote
    min_margin: 3
    conflict_policy: net         # con 'veto' sería idéntica a consensus_3 (auditoría L1)
  - name: weighted_train
    mode: weighted_vote          # pesos = Sharpe de entrenamiento (no negativos)
    use_conviction: false
  - name: consensus_3
    mode: min_consensus
    min_votes: 3
  - name: category_2
    mode: category_consensus     # al menos dos categorías distintas coinciden
    min_categories: 2
  - name: dedup_vote             # miembros = estrategias no redundantes en entrenamiento
    mode: simple_vote
    min_margin: 2
  - name: regime_switch
    mode: min_consensus
    min_votes: 2
    regime_rules:
      trend: {trend: [trend]}                         # categoría tendencia solo en tendencia
      rsi_reversion: {trend: [range]}                 # reversión solo en lateral
      bollinger_reversion: {trend: [range]}
      vwap_deviation: {trend: [range]}
      stoch_rsi: {trend: [range]}
      "*": {liquidity: [normal_liq, unknown]}         # bloquear baja liquidez

# Rejillas acotadas para 'bql walkforward' y 'bql sensitivity' (máx. validation.max_grid_size).
grids:
  ema_crossover: {fast: [8, 12, 20], slow: [26, 50], regime_filter: [none, adx]}
  donchian_breakout: {channel: [20, 40, 55], stop_atr_mult: [2.0, 3.0]}
  rsi_reversion: {oversold: [25, 30], overbought: [70, 75], trend_filter: [none, adx]}
  macd_momentum: {direction_filter: [none, ema, zero_line], require_hist_rising: [true, false]}
  bollinger_reversion: {period: [20, 30], num_std: [2.0, 2.5]}
  stoch_rsi: {lower: [10, 20], upper: [80, 90]}
  adx_di: {adx_threshold: [20, 25, 30], di_margin: [0, 2, 5]}
  volume_spike: {spike_mult: [2.0, 2.5, 3.0], min_body_ratio: [0.4, 0.6]}
  obv_trend: {obv_ema: [10, 20, 40], price_ema: [50, 100]}
  vwap_deviation: {mode: [reversion, continuation], entry_z: [1.5, 2.0, 2.5]}
